name: Python 自动检查

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    name: 检查 Python 程序
    runs-on: ubuntu-latest

    steps:
      - name: 获取项目代码
        uses: actions/checkout@v4

      - name: 准备 Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip

      - name: 安装依赖
        run: python -m pip install -r requirements.txt

      - name: 检查 Python 语法
        run: python -m py_compile clean_sales_data.py python_basics.py

      - name: 运行基础汇总练习
        run: python python_basics.py

      - name: 运行销售数据清洗程序
        run: python clean_sales_data.py

      - name: 检查清洗结果
        run: python check_cleaned_output.py
